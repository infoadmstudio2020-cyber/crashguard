name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Library Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Run library unit tests
        run: |
          ./gradlew :crash-guard:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Verify test results
        if: success()
        run: |
          echo "Library unit tests completed successfully."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            crash-guard/build/reports/tests/**
            crash-guard/build/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Report test failure
        if: failure()
        run: |
          echo "::error::Library unit tests failed."
          echo "Check the unit-test-reports artifact."
          exit 1
