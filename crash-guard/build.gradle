plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.roni.library.crashguard'

    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false

            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {

    // Public API dependencies
    api 'androidx.appcompat:appcompat:1.7.0'

    api 'com.google.android.material:material:1.12.0'

    implementation 'androidx.core:core:1.13.1'

    // Unit testing
    testImplementation 'junit:junit:4.13.2'

    testImplementation 'org.json:json:20240303'

    testImplementation 'org.robolectric:robolectric:4.12.2'

    testImplementation 'androidx.test:core:1.6.1'

    // Instrumentation testing
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

// --------------------------------------------------
// Maven Publication Configuration
// --------------------------------------------------

def pomGroupId =
        project.findProperty('GROUP') ?: rootProject.ext.libraryGroup

def pomArtifactId =
        project.findProperty('POM_ARTIFACT_ID') ?: rootProject.ext.libraryArtifact

def pomVersion =
        project.findProperty('VERSION_NAME') ?: rootProject.ext.libraryVersion

afterEvaluate {

    publishing {

        publications {

            release(MavenPublication) {

                from components.release

                groupId = pomGroupId
                artifactId = pomArtifactId
                version = pomVersion

                pom {

                    name = project.findProperty('POM_NAME') ?: 'CrashGuard'

                    description = project.findProperty('POM_DESCRIPTION') ?:
                            'Android Crash Guard Library'

                    url = project.findProperty('POM_URL') ?:
                            'https://github.com/infoadmstudio2020-cyber/crash-guard'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'infoadmstudio2020-cyber'
                            name = 'MD Roni Hossain'
                        }
                    }

                    scm {
                        connection = project.findProperty('POM_SCM_CONNECTION') ?:
                                'scm:git:https://github.com/infoadmstudio2020-cyber/crash-guard.git'

                        developerConnection = project.findProperty('POM_SCM_DEV_CONNECTION') ?:
                                'scm:git:https://github.com/infoadmstudio2020-cyber/crash-guard.git'

                        url = project.findProperty('POM_SCM_URL') ?:
                                'https://github.com/infoadmstudio2020-cyber/crash-guard'
                    }
                }
            }
        }

        // GitHub Packages
        def ghRepo = System.getenv('GITHUB_REPOSITORY')
        def ghActor = System.getenv('GITHUB_ACTOR')
        def ghToken = System.getenv('GITHUB_TOKEN')

        if (ghRepo && ghActor && ghToken) {

            repositories {

                maven {

                    name = 'GitHubPackages'

                    url = uri(
                        "https://maven.pkg.github.com/${ghRepo}"
                    )

                    credentials {

                        username = ghActor
                        password = ghToken
                    }
                }
            }
        }
    }
}
