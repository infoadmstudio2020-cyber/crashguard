plugins {
    id 'com.android.application'
}

android {
    namespace 'com.roni.integration'
    compileSdk 34

    defaultConfig {
        applicationId 'com.roni.integration'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Consumed exactly like a third-party app would consume the published AAR.
    implementation 'com.roni.library:crash-guard:1.0.0'
}
